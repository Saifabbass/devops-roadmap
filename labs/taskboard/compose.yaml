name: devopps-taskboard
x-app: &application
  image: ${TASKBOARD_IMAGE:-devopps-taskboard:local}
  build:
    context: .
    target: runtime
    args:
      GIT_SHA: ${GIT_SHA:-development}
  environment: &appenv
    DATABASE_URL: postgresql://taskboard:${POSTGRES_PASSWORD:?Run python tools/init_lab.py first}@db:5432/taskboard
    LAB_ALICE_TOKEN: ${LAB_ALICE_TOKEN:?Generate .env first}
    LAB_BOB_TOKEN: ${LAB_BOB_TOKEN:?Generate .env first}
  networks: [backend]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_DB: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes: [taskboard-data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U taskboard -d taskboard']
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    <<: *application
    command: [python, -m, reference.migrate]
    depends_on:
      db: {condition: service_healthy}
  app:
    <<: *application
    command: [python, -m, uvicorn, 'reference.stage${TASKBOARD_STAGE:-07}:app', --host, 0.0.0.0, --port, '8000', --no-access-log]
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 20
  test-db:
    profiles: [test]
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: taskboard_test
      POSTGRES_DB: taskboard_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Generate .env first}
    tmpfs: [/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U taskboard_test -d taskboard_test']
      interval: 2s
      timeout: 2s
      retries: 20
  integration:
    profiles: [test]
    image: devopps-taskboard-tests:local
    build: {context: ., target: tests}
    environment:
      TEST_DATABASE_URL: postgresql://taskboard_test:${TEST_DB_PASSWORD:?Generate .env first}@test-db:5432/taskboard_test
    command: [python, -m, pytest, tests/integration, -p, 'no:cacheprovider']
    depends_on:
      test-db: {condition: service_healthy}
    networks: [backend]
  system:
    profiles: [test]
    image: devopps-taskboard-tests:local
    build: {context: ., target: tests}
    environment:
      TASKBOARD_BASE_URL: http://app:8000
      LAB_ALICE_TOKEN: ${LAB_ALICE_TOKEN:?Generate .env first}
      LAB_BOB_TOKEN: ${LAB_BOB_TOKEN:?Generate .env first}
    command: [python, -m, pytest, tests/system, -p, 'no:cacheprovider']
    depends_on:
      app: {condition: service_healthy}
    networks: [backend]
networks:
  backend:
    internal: true
volumes:
  taskboard-data:
